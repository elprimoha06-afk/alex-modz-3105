name: Build unsigned IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q alexmodz3106.zip
      - run: |
          xcodebuild -project alexmodz3106/ThreeOneOSSix.xcodeproj -scheme 3106 -configuration Release -sdk iphoneos -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - run: |
          mkdir Payload
          cp -R "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/3106.app" Payload/
          zip -qry "3106-3.2.8-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: 3106-unsigned-ipa
          path: "3106-*-unsigned.ipa"
